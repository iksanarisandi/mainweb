<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Main Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <a href="index.html" class="back-link">← Kembali</a>
            
            <div class="auth-box">
                <div class="auth-header">
                    <span class="logo">🚀</span>
                    <h1>Selamat Datang Kembali!</h1>
                    <p>Lanjutkan petualangan coding kamu</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="nama@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div id="errorMessage" class="error-message"></div>

                    <button type="submit" class="btn-primary btn-full">
                        Masuk
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Belum punya akun? <a href="register.html">Daftar Sekarang</a></p>
                </div>
            </div>

            <div class="auth-illustration">
                <div class="stat-card">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-info">
                        <div class="stat-value">7 Hari</div>
                        <div class="stat-desc">Streak Terpanjang</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-info">
                        <div class="stat-value">500 Poin</div>
                        <div class="stat-desc">Progress Terakhir</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
